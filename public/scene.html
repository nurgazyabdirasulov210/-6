<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Живописная деревня</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd0f2; touch-action: none; }
  #c { display: block; width: 100%; height: 100%; touch-action: none; }
  #hint, #loading {
    position: fixed; left: 50%; transform: translateX(-50%);
    font: 600 13px/1.35 "Iowan Old Style", Palatino, "Palatino Linotype", Georgia, serif;
    color: #5c4632; background: rgba(255, 248, 236, 0.9);
    padding: 8px 14px; border-radius: 999px;
    box-shadow: 0 8px 24px rgba(70, 45, 20, 0.16);
    pointer-events: none; z-index: 2;
  }
  #hint { top: max(14px, env(safe-area-inset-top)); opacity: 1; transition: opacity 1.1s ease; max-width: min(92vw, 520px); text-align: center; }
  #hint.hide { opacity: 0; }
  #loading {
    top: 46%; padding: 12px 18px; background: rgba(255, 248, 236, 0.94);
  }
  #loading.hide { display: none; }
  #loading.err { color: #8a2e1c; pointer-events: auto; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="loading">Собираем деревню…</div>
<div id="hint">Тяните, чтобы повернуть · щипок или колёсико — масштаб · два пальца — сдвиг</div>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";

/*
  План сцены (Y вверх, камера с +Z смотрит к озеру на −Z).
  Озеро            z −32…−18
  Особняк          (−12.2, −9.2)  11×8   фасад к площади
  Жёлтый дом       (−16.6,  1.0)  солома слоями
  Коричневый дом   (  1.6, −7.4)  дым из трубы
  Правый дом A     ( 11.4, −4.0)  коричневая крыша
  Правый дом B     ( 16.8,  0.6)  мох и плющ
  Площадь          песок вокруг (0, 1), три газона
  Прилавки         красный, два синих, розовый
  Передний план    плющ и заросшие красные крыши, z 12…20
  Камера           (4.2, 36, 33) → (−1.2, 1.4, −1.5)
*/

const C = {
  grass: 0x67b843,
  grassDark: 0x4e9834,
  grassLight: 0x8ed15a,
  meadow: 0x8fc85e,
  sand: 0xe6c27a,
  sandLight: 0xf0d59a,
  sandDark: 0xd2ae66,
  plaster: 0xf6f1e6,
  plasterWarm: 0xf1e4cc,
  roofRed: 0xe4532a,
  roofRedDark: 0xc74322,
  roofOrange: 0xef6a32,
  thatchY: 0xf3c63f,
  thatchY2: 0xe6b22f,
  thatchY3: 0xf8d56a,
  thatchB: 0xc4843c,
  thatchB2: 0xa56a2e,
  thatchB3: 0xd2984e,
  moss: 0x86a04a,
  mossDark: 0x5f7c36,
  timber: 0x6b442c,
  wood: 0x8d5a36,
  woodDark: 0x6a4128,
  door: 0x7c4a30,
  glass: 0x5d80a6,
  glassDark: 0x3c5874,
  stone: 0xddd6c8,
  stoneDark: 0xb7b0a2,
  ivy: 0x3d9b48,
  ivyDark: 0x2b7436,
  ivyLight: 0x6ec456,
  trunk: 0x6a4530,
  cypress: 0x2f7d4a,
  cypressDark: 0x1e5c36,
  leaf: 0x46a04c,
  leafDeep: 0x2f7a40,
  autumn: 0xc4843c,
  awningBlue: 0x2f74d8,
  awningBlue2: 0x3c86e4,
  awningRed: 0xd44842,
  awningPink: 0xf08aaa,
  vegRed: 0xd6453a,
  vegOrange: 0xef8a2c,
  vegGreen: 0x45a84a,
  vegYellow: 0xf0d04a,
  purple: 0x9b59c8,
  pink: 0xee7aa2,
  skin: 0xe8b892,
  skin2: 0xd9a07c,
  clothBlue: 0x3a6ec4,
  clothRed: 0xc4473e,
  clothGreen: 0x3e8f4e,
  clothBrown: 0x8a5a3a,
  clothNavy: 0x32406a,
  hatRed: 0xd24b3e,
  horse: 0x6b4126,
  horseDark: 0x4a2e1a,
  cloud: 0xfffaf6,
  cloudShade: 0xe4eaf6,
};

const canvas = document.getElementById("c");
const loadingEl = document.getElementById("loading");
const hintEl = document.getElementById("hint");

const renderer = new THREE.WebGLRenderer({
  canvas,
  antialias: true,
  alpha: false,
  powerPreference: "high-performance",
});
const mobile = Math.min(window.innerWidth, window.innerHeight) < 780;
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, mobile ? 1.5 : 1.75));
renderer.setSize(window.innerWidth, window.innerHeight, false);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd7eaf8, 78, 175);
scene.background = new THREE.Color(0x9ecff0);

const camera = new THREE.PerspectiveCamera(38, window.innerWidth / window.innerHeight, 0.15, 260);
const START_POS = new THREE.Vector3(2.2, 31.5, 25.2);
const START_TARGET = new THREE.Vector3(-1.8, 1.15, 0.4);
camera.position.copy(START_POS);

const controls = new OrbitControls(camera, canvas);
controls.target.copy(START_TARGET);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.rotateSpeed = 0.7;
controls.zoomSpeed = 0.85;
controls.panSpeed = 0.75;
controls.screenSpacePanning = true;
controls.zoomToCursor = true;
controls.minDistance = 10;
controls.maxDistance = 78;
controls.minPolarAngle = 0.28;
controls.maxPolarAngle = 1.18;
controls.maxAzimuthAngle = Infinity;
controls.minAzimuthAngle = -Infinity;
controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
controls.update();

// r170 OrbitControls throws if a touch ends before its position is stored.
{
  const origUp = controls._onPointerUp;
  const safeUp = function (event) {
    try { origUp(event); } catch (err) { /* incomplete touch bookkeeping */ }
  };
  controls._onPointerUp = safeUp;
  controls.domElement.removeEventListener("pointercancel", origUp);
  controls.domElement.addEventListener("pointercancel", safeUp);
}

const hemi = new THREE.HemisphereLight(0xcfe4ff, 0x6e9444, 0.68);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xffe0b0, 1.12);
sun.position.set(-28, 50, -14);
sun.castShadow = true;
sun.shadow.mapSize.set(mobile ? 1024 : 2048, mobile ? 1024 : 2048);
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.045;
const sc = sun.shadow.camera;
sc.left = -46; sc.right = 46; sc.top = 46; sc.bottom = -46;
sc.near = 10; sc.far = 140;
sc.updateProjectionMatrix();
sun.target.position.set(-1, 0, -1);
scene.add(sun);
scene.add(sun.target);

const fill = new THREE.DirectionalLight(0xfff3de, 0.32);
fill.position.set(16, 22, 28);
scene.add(fill);

const paint = document.createElement("canvas");
paint.width = paint.height = 256;
{
  const g = paint.getContext("2d");
  g.fillStyle = "#f3f3f3";
  g.fillRect(0, 0, 256, 256);
  for (let i = 0; i < 80; i++) {
    const v = 170 + Math.random() * 80;
    g.fillStyle = `rgba(${v},${v},${v},0.16)`;
    g.beginPath();
    g.ellipse(Math.random() * 256, Math.random() * 256, 12 + Math.random() * 46, 8 + Math.random() * 32, Math.random() * Math.PI, 0, Math.PI * 2);
    g.fill();
  }
  g.globalAlpha = 0.14;
  for (let i = 0; i < 16; i++) {
    g.strokeStyle = Math.random() > 0.5 ? "#ffffff" : "#666666";
    g.lineWidth = 3 + Math.random() * 7;
    g.beginPath();
    g.moveTo(Math.random() * 256, Math.random() * 256);
    g.quadraticCurveTo(Math.random() * 256, Math.random() * 256, Math.random() * 256, Math.random() * 256);
    g.stroke();
  }
}
const paintTex = new THREE.CanvasTexture(paint);
paintTex.wrapS = paintTex.wrapT = THREE.RepeatWrapping;
paintTex.colorSpace = THREE.SRGBColorSpace;
paintTex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());

const matCache = new Map();
function M(hex) {
  const key = hex >>> 0;
  let m = matCache.get(key);
  if (!m) {
    m = new THREE.MeshLambertMaterial({ map: paintTex, color: key });
    matCache.set(key, m);
  }
  return m;
}

function hash(n) {
  const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
  return x - Math.floor(x);
}

function mesh(geo, mat, shadows = true) {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = shadows;
  m.receiveShadow = shadows;
  return m;
}

function wobble(geo, amount, lockY = null) {
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i);
    const y = p.getY(i);
    const z = p.getZ(i);
    if (lockY !== null && Math.abs(y - lockY) < 0.03) continue;
    p.setXYZ(
      i,
      x + (hash(i * 13.1 + x * 0.17) - 0.5) * amount,
      y + (hash(i * 7.7 + 2.2) - 0.5) * amount * 0.28,
      z + (hash(i * 3.3 + z * 0.13) - 0.5) * amount
    );
  }
  p.needsUpdate = true;
  geo.computeVertexNormals();
  geo.computeBoundingSphere();
}

function addBox(group, w, h, d, mat, x, y, z, shadows = true) {
  const m = mesh(new THREE.BoxGeometry(w, h, d), mat, shadows);
  m.position.set(x, y, z);
  group.add(m);
  return m;
}

function pyramidRoof(w, d, h, mat, wob = 0.12) {
  const geo = new THREE.ConeGeometry(1, h, 4);
  geo.rotateY(Math.PI / 4);
  geo.translate(0, h / 2, 0);
  geo.scale(w * Math.SQRT1_2, 1, d * Math.SQRT1_2);
  wobble(geo, wob, 0);
  const m = mesh(geo, mat);
  m.userData.height = h;
  return m;
}

function thatch(w, d, layers, colors, wob = 0.14) {
  const g = new THREE.Group();
  const hh = 0.5;
  const step = 0.34;
  for (let i = 0; i < layers; i++) {
    const t = i / Math.max(1, layers - 1);
    const ww = w * (1.08 - t * 0.6);
    const dd = d * (1.08 - t * 0.52);
    const geo = new THREE.BoxGeometry(ww, hh, dd, 3, 1, 3);
    wobble(geo, wob * (0.65 + t));
    const m = mesh(geo, M(colors[i % colors.length]));
    m.position.set((hash(i * 4 + w) - 0.5) * 0.22, hh / 2 + i * step, (hash(i * 9 + d) - 0.5) * 0.16);
    m.rotation.y = (hash(i * 6 + 8) - 0.5) * 0.09;
    g.add(m);
  }
  g.userData.height = hh + (layers - 1) * step;
  return g;
}

function chimney(group, x, y, z, h = 1.3, color = 0xf4f0e8) {
  addBox(group, 0.48, h, 0.48, M(color), x, y + h / 2, z);
  addBox(group, 0.62, 0.1, 0.62, M(0x5c5854), x, y + h + 0.02, z);
  addBox(group, 0.24, 0.08, 0.24, M(0x2c2a28), x, y + h + 0.09, z);
  return new THREE.Vector3(x, y + h + 0.14, z);
}

function win(group, x, y, z, w, h, ry = 0) {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  g.rotation.y = ry;
  g.add(mesh(new THREE.BoxGeometry(w, h, 0.1), M(C.glass), false));
  g.add(mesh(new THREE.BoxGeometry(0.055, h * 1.02, 0.14), M(C.plaster), false));
  g.add(mesh(new THREE.BoxGeometry(w * 1.02, 0.055, 0.14), M(C.plaster), false));
  group.add(g);
}

function flowerBox(group, x, y, z, w = 0.7) {
  addBox(group, w, 0.14, 0.2, M(C.wood), x, y, z, false);
  const cols = [C.ivy, C.pink, C.vegYellow, C.ivyLight];
  for (let i = 0; i < 3; i++) {
    const s = mesh(new THREE.SphereGeometry(0.09, 5, 4), M(cols[i % cols.length]), false);
    s.position.set(x + (i - 1) * (w * 0.28), y + 0.14, z);
    group.add(s);
  }
}

function door(group, x, z, w, h, y0) {
  addBox(group, w, h, 0.12, M(C.door), x, y0 + h / 2, z);
  const knob = mesh(new THREE.SphereGeometry(0.045, 5, 4), M(0xe6c56a), false);
  knob.position.set(x + w * 0.28, y0 + h * 0.48, z + 0.08);
  group.add(knob);
}

function ivy(group, x, y, z, s, seed) {
  const cols = [C.ivy, C.ivyDark, C.ivyLight, C.leafDeep];
  const n = 4;
  for (let i = 0; i < n; i++) {
    const geo = new THREE.SphereGeometry(s * (0.42 + hash(seed + i * 1.7) * 0.55), 6, 5);
    wobble(geo, s * 0.16);
    const m = mesh(geo, M(cols[(seed + i) % cols.length]));
    m.position.set(
      x + (hash(seed + i * 5.1) - 0.5) * s * 1.5,
      y + (hash(seed + i * 9.3) - 0.45) * s * 0.9,
      z + (hash(seed + i * 3.4) - 0.5) * s * 1.5
    );
    group.add(m);
  }
}

function dormer(matRoof) {
  const g = new THREE.Group();
  addBox(g, 0.78, 0.72, 0.55, M(C.plaster), 0, 0.36, 0);
  const r = pyramidRoof(1.05, 0.9, 0.48, matRoof, 0.05);
  r.position.y = 0.72;
  g.add(r);
  win(g, 0, 0.38, 0.3, 0.34, 0.38);
  return g;
}

const smokeGeo = new THREE.SphereGeometry(0.32, 6, 5);
const smokes = [];
function makeSmoke(x, y, z, opt = {}) {
  const puffs = [];
  const n = opt.count || 14;
  for (let i = 0; i < n; i++) {
    const mat = new THREE.MeshLambertMaterial({
      color: opt.color || 0xf7f4ef,
      transparent: true,
      opacity: 0,
      depthWrite: false,
    });
    const m = new THREE.Mesh(smokeGeo, mat);
    m.castShadow = false;
    m.receiveShadow = false;
    m.renderOrder = 3;
    scene.add(m);
    puffs.push({ m, t: i / n });
  }
  smokes.push({
    x, y, z, puffs,
    speed: opt.speed || 0.11,
    rise: opt.rise || 4.2,
    seed: opt.seed || 1,
    wind: opt.wind || 0.9,
  });
}
function smokeAt(group, x, y, z, opt) {
  const v = new THREE.Vector3(x, y, z);
  group.updateWorldMatrix(true, false);
  group.localToWorld(v);
  makeSmoke(v.x, v.y, v.z, opt);
}

function cypress(h, matHex, detailed) {
  const g = new THREE.Group();
  if (!detailed) {
    const geo = new THREE.ConeGeometry(h * 0.22, h, 6);
    wobble(geo, h * 0.04);
    const m = mesh(geo, M(matHex), false);
    m.position.y = h / 2;
    g.add(m);
    return g;
  }
  const blobs = 4;
  for (let i = 0; i < blobs; i++) {
    const t = i / (blobs - 1);
    const geo = new THREE.SphereGeometry(1, 7, 6);
    wobble(geo, 0.18);
    const m = mesh(geo, M(i % 2 ? matHex : (matHex === C.cypress ? C.cypressDark : C.leafDeep)));
    const r = h * (0.2 - t * 0.09);
    m.scale.set(r * (0.9 + hash(i + h) * 0.25), r * 0.95, r * (0.85 + hash(i + 3) * 0.3));
    m.position.set((hash(i + h) - 0.5) * 0.25, h * (0.18 + t * 0.78), (hash(i + 4) - 0.5) * 0.2);
    g.add(m);
  }
  const trunk = mesh(new THREE.CylinderGeometry(0.1, 0.16, h * 0.28, 5), M(C.trunk), false);
  trunk.position.y = h * 0.1;
  g.add(trunk);
  return g;
}

function roundTree(r, matHex, trunkH = 0.9) {
  const g = new THREE.Group();
  const trunk = mesh(new THREE.CylinderGeometry(0.12, 0.18, trunkH, 5), M(C.trunk));
  trunk.position.y = trunkH / 2;
  g.add(trunk);
  const geo = new THREE.SphereGeometry(r, 7, 6);
  wobble(geo, r * 0.18);
  const crown = mesh(geo, M(matHex));
  crown.position.y = trunkH + r * 0.62;
  crown.scale.y = 0.78;
  g.add(crown);
  const geo2 = new THREE.SphereGeometry(r * 0.68, 6, 5);
  wobble(geo2, r * 0.12);
  const c2 = mesh(geo2, M(matHex === C.autumn ? 0xb87430 : C.leafDeep));
  c2.position.set(r * 0.45, trunkH + r * 0.45, r * 0.15);
  g.add(c2);
  return g;
}

function hill(x, y, z, sx, sy, sz, color, shadows = false) {
  const geo = new THREE.SphereGeometry(1, 10, 8);
  wobble(geo, 0.08);
  const m = mesh(geo, M(color), shadows);
  m.position.set(x, y, z);
  m.scale.set(sx, sy, sz);
  return m;
}

const legGeo = new THREE.CylinderGeometry(0.055, 0.048, 0.34, 5);
legGeo.translate(0, -0.17, 0);
const armGeo = new THREE.CylinderGeometry(0.042, 0.036, 0.28, 4);
armGeo.translate(0, -0.14, 0);

function makePerson(opt) {
  const g = new THREE.Group();
  const cloth = M(opt.cloth);
  const skin = M(opt.skin || C.skin);
  let body;
  if (opt.dress) {
    body = mesh(new THREE.ConeGeometry(0.28, 0.52, 7), cloth);
    body.position.y = 0.58;
  } else {
    body = mesh(new THREE.CylinderGeometry(0.16, 0.22, 0.46, 6), cloth);
    body.position.y = 0.62;
  }
  g.add(body);
  const head = mesh(new THREE.SphereGeometry(0.15, 7, 6), skin);
  head.position.y = 1.0;
  g.add(head);
  const l1 = mesh(legGeo, M(opt.pants || C.clothNavy));
  l1.position.set(-0.07, 0.38, 0);
  const l2 = mesh(legGeo, M(opt.pants || C.clothNavy));
  l2.position.set(0.07, 0.38, 0);
  g.add(l1, l2);
  const a1 = mesh(armGeo, cloth, false);
  a1.position.set(-0.22, 0.82, 0);
  const a2 = mesh(armGeo, cloth, false);
  a2.position.set(0.22, 0.82, 0);
  g.add(a1, a2);
  if (opt.hat) {
    const brim = mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.05, 8), M(opt.hat), false);
    brim.position.y = 1.1;
    const cap = mesh(new THREE.ConeGeometry(0.15, 0.22, 6), M(opt.hat), false);
    cap.position.y = 1.22;
    g.add(brim, cap);
  }
  g.userData.legs = [l1, l2];
  g.userData.arms = [a1, a2];
  g.scale.setScalar(opt.scale || 1.6);
  g.traverse((o) => {
    if (o.isMesh) {
      o.castShadow = true;
      o.receiveShadow = true;
    }
  });
  return g;
}

function makeHorse() {
  const g = new THREE.Group();
  const body = mesh(new THREE.BoxGeometry(1.05, 0.42, 0.36), M(C.horse));
  body.position.y = 0.78;
  const neck = mesh(new THREE.BoxGeometry(0.24, 0.42, 0.22), M(C.horse));
  neck.position.set(0.48, 1.05, 0);
  neck.rotation.z = -0.6;
  const head = mesh(new THREE.BoxGeometry(0.38, 0.2, 0.18), M(C.horse));
  head.position.set(0.74, 1.18, 0);
  const mane = mesh(new THREE.BoxGeometry(0.12, 0.28, 0.1), M(C.horseDark), false);
  mane.position.set(0.42, 1.18, 0);
  const tail = mesh(new THREE.ConeGeometry(0.07, 0.38, 4), M(C.horseDark), false);
  tail.position.set(-0.58, 0.9, 0);
  tail.rotation.z = Math.PI / 2.4;
  g.add(body, neck, head, mane, tail);
  const legs = [];
  for (const [x, z] of [[0.32, 0.12], [0.32, -0.12], [-0.32, 0.12], [-0.32, -0.12]]) {
    const leg = mesh(new THREE.CylinderGeometry(0.045, 0.05, 0.46, 4), M(C.horseDark));
    leg.geometry.translate(0, -0.23, 0);
    leg.position.set(x, 0.52, z);
    g.add(leg);
    legs.push(leg);
  }
  g.userData.legs = legs;
  const rider = makePerson({ cloth: C.clothBrown, hat: 0x4a3428, pants: C.clothNavy, skin: C.skin2, scale: 0.92 });
  rider.position.set(-0.02, 0.78, 0);
  g.add(rider);
  g.scale.setScalar(1.35);
  return g;
}

function stall(x, z, rot, color, accent) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  g.rotation.y = rot;
  const posts = [[-0.85, -0.45], [0.85, -0.45], [-0.85, 0.45], [0.85, 0.45]];
  for (const [px, pz] of posts) {
    const p = mesh(new THREE.CylinderGeometry(0.055, 0.065, 1.55, 5), M(C.wood));
    p.position.set(px, 0.78, pz);
    g.add(p);
  }
  addBox(g, 1.9, 0.1, 1.05, M(C.woodDark), 0, 0.78, 0);
  const top = mesh(new THREE.BoxGeometry(2.25, 0.1, 1.35), M(color));
  top.position.set(0, 1.72, 0.05);
  top.rotation.x = 0.22;
  g.add(top);

const walkers = [];
function addWalker(person, path, speed) {
  person.position.copy(path[0]);
  scene.add(person);
  walkers.push({ mesh: person, path, speed, t: hash(path[0].x * 10 + speed) * path.length });
}

function follow(w, dt) {
  w.t += dt * w.speed;
  const pts = w.path;
  const u = w.t % pts.length;
  const i = Math.floor(u) % pts.length;
  const f = u - Math.floor(u);
  const a = pts[i];
  const b = pts[(i + 1) % pts.length];
  w.mesh.position.lerpVectors(a, b, f);
  const dx = b.x - a.x;
  const dz = b.z - a.z;
  if (dx * dx + dz * dz > 1e-6) w.mesh.rotation.y = Math.atan2(dx, dz);
  const step = Math.sin(w.t * 7.5);
  w.mesh.position.y = Math.abs(step) * 0.05;
  const legs = w.mesh.userData.legs;
  const arms = w.mesh.userData.arms;
  if (legs && legs.length === 2) {
    legs[0].rotation.x = step * 0.7;
    legs[1].rotation.x = -step * 0.7;
  } else if (legs) {
    legs.forEach((leg, idx) => {
      leg.rotation.x = (idx % 2 ? -1 : 1) * step * 0.45;
    });
  }
  if (arms) {
    arms[0].rotation.x = -step * 0.5;
    arms[1].rotation.x = step * 0.5;
  }
}

  }

  function strip(x1, z1, x2, z2, width) {
    const dx = x2 - x1;

    const m = mesh(new THREE.BoxGeometry(width, 0.05, len), M(C.sandDark), false);

  strip(-10, 2.2, -15.5, 1.6, 1.7);

    depthWrite: false,

      uTime: { value: 0 },
      uShallow: { value: new THREE.Color(0x4ea4dc) },
      uDeep: { value: new THREE.Color(0x1d6aaf) },
    },
    vertexShader: `
      uniform float uTime;
      varying float vH;
      varying vec2 vUv;
      void main() {
        vUv = uv;
        vec3 p = position;
        float w = sin(p.x * 0.42 + uTime * 0.9) * 0.09
                + cos(p.z * 0.52 - uTime * 0.7) * 0.07
                + sin((p.x + p.z) * 0.28 + uTime * 0.45) * 0.05;
        p.y += w;

    fragmentShader: `

  });

  water.receiveShadow = false;
  scene.add(water);

  for (let i = 0; i < 16; i++) {

  scene.add(hill(-8, 1.2, -52, 16, 5.5, 8, 0x7eaf6c, false));
  scene.add(hill(14, 2.2, -58, 22, 7.2, 10, 0x8fb8d6, false));

  scene.add(hill(0, 3.4, -70, 36, 8, 12, 0xb7cbe4, false));

  return water;
}

}

function buildNature() {
  const spots = [
    [-22.5, -4, 9.5, C.cypressDark, true],
    [-20.2, -9, 11, C.cypress, true],
    [-21.4, 1.5, 8.2, C.cypressDark, true],
    [-18.6, -14.2, 7.4, C.cypress, true],
    [-15.2, -16.2, 6.6, C.leafDeep, true],
    [-9.5, -16.8, 7.8, C.cypress, true],
    [-6.2, -15.4, 5.2, C.cypressDark, true],
    [6.4, -16.2, 6.4, C.cypress, true],
    [18.5, -15.5, 8.2, C.cypressDark, true],
    [23.2, -10, 9.4, C.cypress, true],
    [25.5, -3.5, 7.2, C.leafDeep, true],
    [22.4, 3.2, 6.2, C.cypressDark, true],
    [-26, -12, 10, C.cypress, false],
  ];
  for (const [x, z, h, col, det] of spots) {
    const t = cypress(h, col, det);
    t.position.set(x, 0, z);
    scene.add(t);
  }
  const rounds = [
    [-4.2, -14.6, 2.3, C.autumn, 1.1],
    [5.2, -13.8, 2.5, C.leaf, 0.8],
    [20.2, -7.5, 2.2, C.leaf, 0.7],
    [-24, 4, 2.4, C.leafDeep, 0.6],
    [27, -16, 2.6, C.leaf, 0.5],
    [9.5, -17.5, 2.1, 0x6aaa48, 0.6],
    [-1, -18, 1.8, C.leafDeep, 0.4],
  ];
  for (const [x, z, r, col, th] of rounds) {
    const t = roundTree(r, col, th);
    t.position.set(x, 0, z);
    scene.add(t);
  }
  for (let i = 0; i < 18; i++) {
    const x = -36 + i * 4.3 + (hash(i + 50) - 0.5) * 1.6;
    const h = 5 + hash(i + 80) * 6;
    const t = cypress(h, hash(i) > 0.5 ? C.cypress : C.cypressDark, false);
    t.position.set(x, 0, -21.5 + Math.sin(i * 0.7) * 1.4);
    scene.add(t);
  }
  for (let i = 0; i < 8; i++) {
    const t = roundTree(1.6 + hash(i + 3), i % 2 ? C.leaf : C.leafDeep, 0.5);
    t.position.set(-30 + i * 9, 0, -40 - hash(i) * 4);
    t.traverse((o) => { if (o.isMesh) o.castShadow = false; });
    scene.add(t);
  }

  const reedsGeo = new THREE.ConeGeometry(0.07, 0.7, 4);
  reedsGeo.translate(0, 0.35, 0);
  const reedCount = 70;
  const reeds = new THREE.InstancedMesh(reedsGeo, M(C.grassDark), reedCount);
  const dummy = new THREE.Object3D();
  for (let i = 0; i < reedCount; i++) {
    dummy.position.set(-32 + hash(i + 9) * 68, 0.12, -18.6 + (hash(i + 21) - 0.5) * 2.4);
    dummy.scale.set(0.8 + hash(i), 0.7 + hash(i + 2) * 0.9, 0.8);
    dummy.rotation.y = hash(i + 4) * Math.PI;
    dummy.updateMatrix();
    reeds.setMatrixAt(i, dummy.matrix);
  }
  reeds.castShadow = false;
  reeds.receiveShadow = false;
  scene.add(reeds);

  const tuftGeo = new THREE.ConeGeometry(0.14, 0.42, 4);
  tuftGeo.translate(0, 0.2, 0);
  const tuftN = 90;
  const tufts = new THREE.InstancedMesh(tuftGeo, M(C.grassLight), tuftN);
  const lawns = [[-1.7, 2.35, 2.7, 2.25], [8.4, 0.15, 1.85, 1.62], [0.35, -2.55, 1.92, 1.48]];
  for (let i = 0; i < tuftN; i++) {
    const L = lawns[i % lawns.length];
    const edge = i % 4;
    const t = hash(i * 3 + 11);
    const j = (hash(i * 5 + 2) - 0.5) * 0.5;
    let x;
    let z;
    if (edge === 0) { x = L[0] - L[2] + t * L[2] * 2; z = L[1] - L[3] + j; }
    else if (edge === 1) { x = L[0] + L[2] + j; z = L[1] - L[3] + t * L[3] * 2; }
    else if (edge === 2) { x = L[0] - L[2] + t * L[2] * 2; z = L[1] + L[3] + j; }
    else { x = L[0] - L[2] + j; z = L[1] - L[3] + t * L[3] * 2; }
    dummy.position.set(x, 0.16, z);
    dummy.scale.setScalar(0.7 + hash(i + 6) * 0.7);
    dummy.rotation.y = hash(i + 8) * 6;
    dummy.updateMatrix();
    tufts.setMatrixAt(i, dummy.matrix);
  }
  tufts.castShadow = false;
  scene.add(tufts);

  const flowerCols = [C.pink, 0x6aa4ee, C.vegYellow, C.purple, 0xffffff];
  function dots(x, z, n, spread, y) {
    for (let i = 0; i < n; i++) {
      const s = mesh(new THREE.SphereGeometry(0.07 + hash(i + x) * 0.04, 5, 4), M(flowerCols[(i + Math.round(x * 3)) % flowerCols.length]), false);
      s.position.set(x + (hash(i + z) - 0.5) * spread, y, z + (hash(i * 2 + x) - 0.5) * spread);
      scene.add(s);
    }
  }
  dots(8.2, 0.4, 7, 2.2, 0.28);
  dots(12.4, 2.6, 6, 1.6, 0.12);
  dots(-6.5, 6.4, 5, 1.3, 0.12);
  dots(-1.4, 2.2, 5, 1.8, 0.26);
  dots(4.2, -14.2, 6, 1.4, 0.16);

  [[-19, -16], [8, -18.5], [24, -14], [-8, 7.5], [14.8, 8]].forEach(([x, z], i) => {
    const geo = new THREE.DodecahedronGeometry(0.28 + hash(i) * 0.2, 0);
    wobble(geo, 0.08);
    const r = mesh(geo, M(i % 2 ? C.stone : C.stoneDark), false);
    r.position.set(x, 0.18, z);
    r.rotation.set(hash(i), hash(i + 2) * 2, 0);
    scene.add(r);
  });
}

  ], 0.55);

  const horse = makeHorse();
  addWalker(horse, [
    new THREE.Vector3(-5.4, 0, -1.4),
    new THREE.Vector3(-1.6, 0, -1.9),
    new THREE.Vector3(2.6, 0, -1.2),
    new THREE.Vector3(4.8, 0, 0.6),
    new THREE.Vector3(1.2, 0, 0.4),

  ], 0.28);

  const nearHouse = makePerson({ cloth: 0xc46a5a, pants: C.clothNavy, skin: C.skin });
  nearHouse.position.set(-13.6, 0, -1.2);

function buildClouds() {
  const clouds = [];
  const specs = [
    [-16, 24, -8, 3.4],
    [2, 26, -18, 4.2],
    [18, 23, -6, 3.1],
    [-6, 28, 4, 2.6],
    [24, 25, -22, 3.6],
    [-28, 22, -16, 2.8],
    [10, 22, 8, 2.2],
    [-2, 30, -28, 4.8],
  ];
  const matA = new THREE.MeshBasicMaterial({ color: C.cloud, transparent: true, opacity: 0.94, depthWrite: false, toneMapped: false });
  const matB = new THREE.MeshBasicMaterial({ color: C.cloudShade, transparent: true, opacity: 0.9, depthWrite: false, toneMapped: false });
  for (const [x, y, z, s] of specs) {
    const g = new THREE.Group();
    g.position.set(x, y, z);
    const blobs = 5;
    for (let i = 0; i < blobs; i++) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(1, 8, 6), i === 1 ? matB : matA);
      const sc = s * (0.55 + hash(i + x) * 0.45);
      m.scale.set(sc * 1.45, sc * 0.62, sc);
      m.position.set((i - blobs / 2) * s * 0.72, (hash(i + y) - 0.4) * s * 0.25, (hash(i + z) - 0.5) * s * 0.4);
      g.add(m);
    }
    scene.add(g);
    clouds.push({ g, speed: 0.35 + hash(x + y) * 0.35 });
  }
  return clouds;
}

function buildSky() {
  const geo = new THREE.SphereGeometry(190, 28, 18);
  const mat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    toneMapped: false,
    uniforms: {
      top: { value: new THREE.Color(0x6eaeeb) },
      mid: { value: new THREE.Color(0xb7d8f6) },
      hor: { value: new THREE.Color(0xd7eaf8) },
    },
    vertexShader: `
      varying vec3 vP;
      void main() {
        vP = position;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      varying vec3 vP;
      uniform vec3 top;
      uniform vec3 mid;
      uniform vec3 hor;
      void main() {
        float h = normalize(vP).y;
        vec3 c = mix(hor, mid, smoothstep(-0.05, 0.22, h));
        c = mix(c, top, smoothstep(0.15, 0.72, h));
        gl_FragColor = vec4(c, 1.0);
      }
    `,
  });
  const sky = new THREE.Mesh(geo, mat);
  sky.frustumCulled = false;
  scene.add(sky);
  return sky;
}

const water = buildGround();
buildMansion();
buildYellow();
buildBrown();
buildRightHouses();
buildForeground();
buildNature();
buildPeople();
const clouds = buildClouds();
const sky = buildSky();

const sparkles = [];
for (let i = 0; i < 22; i++) {
  const m = new THREE.Mesh(
    new THREE.SphereGeometry(0.055, 4, 3),
    new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.8, depthWrite: false, toneMapped: false })
  );
  m.position.set((hash(i + 30) - 0.5) * 46, 8 + hash(i + 70) * 14, -24 + hash(i + 15) * 28);
  scene.add(m);
  sparkles.push({ m, base: m.position.clone(), ph: hash(i) * 6 });
}

let last = performance.now();
function frame(now) {
  try {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  const t = now * 0.001;

  water.material.uniforms.uTime.value = t;
  sky.position.copy(camera.position);

  for (const s of smokes) {
    for (const p of s.puffs) {
      p.t += dt * s.speed;
      if (p.t > 1) p.t -= 1;
      const k = p.t;
      p.m.position.set(
        s.x + Math.sin(k * 8 + s.seed) * 0.5 * k + k * s.wind,
        s.y + k * s.rise,
        s.z + Math.cos(k * 6 + s.seed * 1.7) * 0.35 * k
      );
      const sca = 0.22 + k * 1.25;
      p.m.scale.setScalar(sca);
      p.m.material.opacity = Math.sin(k * Math.PI) * 0.32;
    }
  }

  for (const w of walkers) {
    if (w.idle) {
      w.mesh.position.y = Math.sin(t * 2 + w.phase) * 0.03;
      continue;
    }
    follow(w, dt);
  }

  for (const c of clouds) {
    c.g.position.x += dt * c.speed;
    if (c.g.position.x > 40) c.g.position.x = -40;
  }

  for (const s of sparkles) {
    s.m.position.y = s.base.y + Math.sin(t * 0.8 + s.ph) * 0.35;
    s.m.position.x = s.base.x + Math.sin(t * 0.25 + s.ph) * 0.4;
  }

  controls.update();
  renderer.render(scene, camera);
  } catch (err) {
    console.error(err);
  }
}

function resize() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  camera.aspect = w / Math.max(1, h);
  camera.updateProjectionMatrix();
  renderer.setSize(w, h, false);
}
window.addEventListener("resize", resize);

function hideHint() {
  hintEl.classList.add("hide");
}
canvas.addEventListener("pointerdown", () => {
  hideHint();
}, { once: true });
setTimeout(hideHint, 5200);

canvas.addEventListener("dblclick", () => {
  camera.position.copy(START_POS);
  controls.target.copy(START_TARGET);
});

renderer.setAnimationLoop(frame);
loadingEl.classList.add("hide");
</script>
